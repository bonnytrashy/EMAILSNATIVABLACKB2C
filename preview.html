<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prévia Esquenta Black</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #EDEAE3; font-family: Arial, sans-serif; color: #3D3A35; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; font-size: 14px; color: #6E695F; }
  .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
  .frame { display: flex; flex-direction: column; gap: 8px; }
  .frame span { font-size: 13px; font-weight: bold; }
  iframe { border: 0; background: #FFFFFF; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
  .desk { width: 600px; height: 2300px; }
  .mob { width: 375px; height: 2300px; border-radius: 24px; }
</style>
</head>
<body>
  <h1>Esquenta da Black Nativa | prévia</h1>
  <p class="sub">Assunto: O esquenta da Black Nativa começou ☀️ · Pré-cabeçalho: Os Cremes Multifuncionais com 20% OFF e kits com até 30% OFF no site.</p>
  <div class="row">
    <div class="frame"><span>Desktop · 600 px</span><iframe class="desk" title="Prévia desktop"></iframe></div>
    <div class="frame"><span>Celular · 375 px</span><iframe class="mob" title="Prévia celular"></iframe></div>
  </div>
  <script>
    // Carrega o e-mail com as imagens da pasta local images/, para a prévia funcionar antes da hospedagem.
    fetch('email-esquenta-black.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        html = html.replace('PREENCHER_URL_LOGO', 'images/logo-nativa.png')
                   .replace('PREENCHER_URL_IMAGEM_PRINCIPAL', 'images/esquenta-black-cremes-multifuncionais.jpg');
        document.querySelectorAll('iframe').forEach(function (f) { f.srcdoc = html; });
      });
  </script>
</body>
</html>
